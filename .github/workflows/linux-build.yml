name: Build native Linux release files

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64:
    name: Linux x64 (Ubuntu 22.04 baseline)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install build-host desktop and native tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y python3-venv python3-tk build-essential cmake git patchelf squashfs-tools xvfb xauth libicu70 libssl3 zlib1g

      - name: Install converter build SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '9.0.318'

      - name: Select the pinned SDK instead of the runner's newest SDK
        run: |
          printf '{"sdk":{"version":"9.0.318","rollForward":"disable","allowPrerelease":false}}\n' > global.json
          dotnet --version

      - name: Run portable source tests
        run: python3 -m unittest discover -s tests -v

      - name: Build native converter, Python bundle and Linux release files
        run: python3 tools/build_linux.py --prepare-dependencies

      - name: Test AppImage and portable archive without system ICU, Python or .NET
        run: python3 tools/build_linux.py --test-no-system-icu

      - name: Upload Linux release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fftic-randomizer-linux-x64
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            outputs/FFTIC-Randomizer-*-x86_64.AppImage
            outputs/*-linux-x64.tar.gz
            outputs/*-linux-x64-checksums.txt
            outputs/*-linux-x64-build-receipt.json

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fftic-randomizer-linux-build-diagnostics
          if-no-files-found: warn
          retention-days: 14
          path: |
            research/linux-build/*.log
            research/linux-build/*-smoke.json
            research/linux-build/bundle-inputs.json
            research/linux-build/*-converter-integration/*.log
            research/linux-build/*-converter-integration/result.json
            research/linux-build/no-system-icu/*.log
            research/linux-build/no-system-icu/result.json
            research/linux-build/no-system-icu/evidence/*.log
            research/linux-build/no-system-icu/evidence/*-integration/*.log
            research/linux-build/no-system-icu/evidence/*-integration/result.json
            research/linux-converter-build/codec-tests.txt
            research/linux-converter-build/notice-tests.txt
            research/linux-converter-build/publish.txt
            research/linux-converter-build/converter-help.txt
            research/linux-converter-build/integration/*.log
            research/linux-converter-build/integration/result.json
